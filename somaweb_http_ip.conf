# /etc/httpd/conf.d/somaweb.conf
# ============================================================
# SOMAWEB - Apache + mod_wsgi (HTTP only)
# ------------------------------------------------------------
# Yo dejé esto en HTTP por ahora, porque estamos en etapa de pruebas.
# Cuando pasemos a HTTPS, se agrega un VirtualHost :443 con mod_ssl
# y se hace redirect 80 -> 443.
# ============================================================

<VirtualHost *:80>
    # IP del servidor (acceso por IP, no por dominio)
    ServerName __SITE_IP__

    # Logs dedicados del sitio (esto me ayuda a depurar rápido)
    ErrorLog  /var/log/httpd/somaweb_error.log
    CustomLog /var/log/httpd/somaweb_access.log combined

    # Proceso WSGI (daemon mode) para aislar la app.
    # - python-home apunta al venv donde instalé requirements.
    # - python-path apunta a la carpeta del proyecto.
    WSGIDaemonProcess somaweb \
        user=apache group=apache \
        threads=5 \
        python-home=/var/www/somaweb/.venv \
        python-path=/var/www/somaweb

    WSGIProcessGroup somaweb

    # Conecto la raíz "/" al entrypoint WSGI del proyecto
    WSGIScriptAlias / /var/www/somaweb/somaweb.wsgi

    # Sirvo /static directamente por Apache (más eficiente que pasarlo por Flask)
    Alias /static/ /var/www/somaweb/app/static/
    <Directory /var/www/somaweb/app/static>
        Require all granted
    </Directory>

    # Permiso de acceso al proyecto
    <Directory /var/www/somaweb>
        Require all granted
    </Directory>

    # Por si llego a usar headers Authorization (login, tokens, etc.)
    WSGIPassAuthorization On
</VirtualHost>
