{% extends "base.html" %}
{% block title %}Iniciar sesión{% endblock %}
{% block content %}
<div class="card" style="max-width:420px; margin:24px auto;">
  <div class="card__body">
    <h2 class="card__title" style="text-align:center;">Iniciar sesión</h2>
    <p class="card__subtitle" style="text-align:center;">SOMA Web</p>

    {% if error %}
      <div class="badge" style="background:#fff5f5; border-color:#b00020; color:#b00020; display:block; margin:10px 0;">
        {{ error }}
      </div>
    {% endif %}

    <form class="form" method="post" action="{{ url_for('auth.login_submit') }}{% if request.args.get('next') %}?next={{ request.args.get('next') }}{% endif %}">
      <div class="field">
        <label>Correo</label>
        <input type="email" name="email" value="{{ email or '' }}" required autocomplete="off">
      </div>
      <div class="field">
        <label>Contraseña</label>
        <input type="password" name="password" required>
      </div>
      <div class="actions" style="margin-top:12px;">
        <button class="btn btn-primary" type="submit" style="width:100%;">Ingresar</button>
      </div>
    </form>

    <p style="text-align:center; font-size:13px; color:var(--muted); margin-top:14px;">
      ¿No tienes cuenta? <a href="{{ url_for('auth.register_form') }}">Crear cuenta</a>
    </p>
  </div>
</div>
{% endblock %}
