<div class="auth-card">
  <h2>Crear cuenta</h2>
  <p class="subtitle">SOMA Web</p>

  @if (error()) {
    <div class="alert-error">{{ error() }}</div>
  }

  <form (ngSubmit)="submit()" #f="ngForm">
    <div class="field">
      <label for="nombre">Nombre</label>
      <input id="nombre" name="nombre" [(ngModel)]="nombre" required />
    </div>
    <div class="field">
      <label for="email">Correo</label>
      <input id="email" type="email" name="email" [(ngModel)]="email" required autocomplete="off" />
    </div>
    <div class="field">
      <label for="password">Contraseña</label>
      <div class="field">
      <label for="password">Contraseña</label>
      <input id="password" type="password" name="password" [(ngModel)]="password" required minlength="10" />
      <small style="color:#888; font-size:12px;">Mínimo 10 caracteres.</small>
    </div>
      <input id="password" type="password" name="password" [(ngModel)]="password" required />
    </div>
    <div class="field">
      <label for="password2">Repetir contraseña</label>
      <input id="password2" type="password" name="password2" [(ngModel)]="password2" required />
    </div>
    <button class="btn-primary" type="submit" [disabled]="f.invalid || loading()">
      {{ loading() ? 'Creando...' : 'Crear cuenta' }}
    </button>
  </form>

  <p class="footer-link">¿Ya tienes cuenta? <a routerLink="/login">Iniciar sesión</a></p>
</div>
