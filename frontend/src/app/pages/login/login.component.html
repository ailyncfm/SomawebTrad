<div class="auth-card">
  <h2>Iniciar sesión</h2>
  <p class="subtitle">SOMA Web</p>

  @if (error()) {
    <div class="alert-error">{{ error() }}</div>
  }

  <form (ngSubmit)="submit()" #f="ngForm">
    <div class="field">
      <label for="email">Correo</label>
      <input id="email" type="email" name="email" [(ngModel)]="email" required autocomplete="off" />
    </div>
    <div class="field">
      <label for="password">Contraseña</label>
      <input id="password" type="password" name="password" [(ngModel)]="password" required />
    </div>
    <button class="btn-primary" type="submit" [disabled]="f.invalid || loading()">
      {{ loading() ? 'Ingresando...' : 'Ingresar' }}
    </button>
  </form>

  <p class="footer-link">¿No tienes cuenta? <a routerLink="/registro">Crear cuenta</a></p>
</div>
